name: Monthly page feed refresh

# The production job. This used to run on Railway, on a volume mounted at
# /data. It now runs here instead: the monthly snapshot and location cache
# are committed back into this repo as ordinary git history rather than
# living on a platform-specific volume, so the run's state is reviewable,
# diffable, and survives regardless of which CI platform runs the job.
# See CLAUDE.md and DECISIONS.md (D9-D11) for the full migration rationale.
#
# It runs here rather than on a laptop because the site's protection layer
# rejects unfamiliar client IPs, so the pages cannot reliably be read from
# a home or office connection — see DECISIONS.md D3 and D9.

on:
  schedule:
    # 03:00 UTC on the 1st of every month — the same schedule railway.json
    # used to run. GitHub may delay a scheduled run by minutes to a couple
    # of hours under load; irrelevant at monthly cadence.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      full_status:
        description: "Status check every URL, not only the changed/facet ones. Slower, more thorough."
        type: boolean
        default: true
      dry_run:
        description: "Do everything except writing the snapshot, committing state, and sending email."
        type: boolean
        default: false

# Only one refresh in flight at a time, so a manual run triggered while the
# scheduled one is still going can't race it to commit/push the same files.
concurrency:
  group: monthly-page-feed-refresh
  cancel-in-progress: false

permissions:
  contents: write   # required to commit the updated snapshot/location cache back to the repo

jobs:
  refresh:
    name: Fetch, label, validate, and persist
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Fail here rather than partway through a run if this runner's IP or
      # TLS fingerprint gets rejected the way a plain home connection does.
      - name: Check the site answers from this runner
        run: |
          cd src
          python -c "import fetcher; b = fetcher.get('https://www.riparide.com/listings/97-pebble-point'); print('site reachable, %d bytes' % len(b))"

      - name: Run the refresh
        run: |
          FLAGS=""
          if [ "${{ inputs.full_status }}" = "true" ]; then FLAGS="$FLAGS --full-status"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          python src/run.py $FLAGS

      - name: Show what was produced
        if: always()
        run: |
          ls -la data/output || echo "no output directory"
          for f in data/output/*.csv; do
            [ -e "$f" ] || continue
            echo "=== $f: $(( $(wc -l < "$f") - 1 )) rows ==="
            head -3 "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riparide-page-feed-${{ github.run_number }}
          path: data/output/*.csv
          if-no-files-found: ignore
          retention-days: 90

      # Runs even if the refresh step above failed, so a partially-filled
      # location cache from before the failure is not thrown away — but a
      # failed run never touches data/snapshot.json in the first place
      # (run.py only writes it after a full success), so a bad run can never
      # commit a bad baseline. Skipped entirely for an explicit dry run.
      - name: Persist snapshot + location cache back to the repo
        if: always() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CANDIDATES=(data/snapshot.json data/snapshot.json.previous data/location-cache.json)
          EXISTING=()
          for f in "${CANDIDATES[@]}"; do
            [ -e "$f" ] && EXISTING+=("$f")
          done

          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "no state files exist yet, nothing to persist"
            exit 0
          fi

          git add "${EXISTING[@]}"
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi

          git commit -m "Update page feed state ($(date -u +%Y-%m-%d))"

          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            echo "push rejected, retrying once after a rebase onto the latest remote"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
