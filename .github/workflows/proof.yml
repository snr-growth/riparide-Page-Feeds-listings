name: Change detection proof

# Runs the proof on every push, so anyone looking at the repository can see
# for themselves that change detection works, without taking it on trust and
# without running anything locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  proof:
    name: Prove the refresh notices what changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Change detection proof
        run: python src/prove_diff.py

      - name: Check every module imports cleanly
        run: |
          cd src
          python -c "import config, fetcher, labeller, enricher, attributes, store, validator, writer, report, sheets, emailer, run; print('all 12 modules import cleanly')"

      - name: Unit tests (labeller, validator, attributes, enricher, fetcher, store, report, sheets)
        run: |
          cd src
          python -m unittest discover -p "test_*.py" -v
